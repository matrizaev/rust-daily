[package]
name = "rust-daily-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
actix-cors = "0.7.2"
actix-files = "0.7.2"
actix-web = "4.17.0"
cargo_metadata = "0.23"
config = { version = "0.15.27", default-features = false, features = ["yaml"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
uuid = { version = "1.29.0", features = ["v4"] }
url = "2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
